server:
  port: 4004

spring:
  cloud:
    gateway:
      routes:
      - id: patient-server-route
        uri: http://patient-service:4000
        predicates:
        - Path=/api/patients/**
        filters:
        - StripPrefix=1

      - id: api-docs-patient-route
        uri: http://patient-service:4000
        predicates:
        - Path=/api-docs/patients
        filters:
        - rewrite-path=/api-docs/patients, /v3/api-docs
